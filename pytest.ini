[pytest]
# The three packages the previous runner discovered.  ``user/admin/tests`` was
# not a package and was never collected; listing the paths explicitly keeps the
# suite the same size it was.
testpaths = core/tests recipe/tests user/tests
python_files = test_*.py
python_classes = *Tests
# Every test in this suite lives on a TestCase.  The module-level
# ``test_user``/``test_user_other`` helpers build fixtures and were never
# tests, so bare function collection stays switched off.
python_functions = _no_bare_functions_
