{% extends 'admin/master.html' %}

{% block body %}
<div class="container">
  <h1>{{ _('log_in') }}</h1>
  {% if error %}
  <p class="text-danger">{{ error }}</p>
  {% endif %}
  <form method="post">
    <div class="form-group">
      {{ form.email.label }}
      {{ form.email(class_='form-control') }}
    </div>
    <div class="form-group">
      {{ form.password.label }}
      {{ form.password(class_='form-control') }}
    </div>
    <button type="submit" class="btn btn-primary">{{ _('log_in') }}</button>
  </form>
</div>
{% endblock %}
